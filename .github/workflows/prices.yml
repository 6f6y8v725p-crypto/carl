name: Koersen ophalen (Yahoo)
on:
  schedule:
    - cron: "5,35 7-17 * * 1-5"
    - cron: "15 21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_prices.py
      - name: Commit alleen bij wijziging
        run: |
          if git diff --quiet -- prices.json && git ls-files --error-unmatch prices.json >/dev/null 2>&1; then echo "geen wijziging"; exit 0; fi
          git config user.name "koersen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "Koersen bijwerken [skip ci]"
          git pull --rebase -q && git push
